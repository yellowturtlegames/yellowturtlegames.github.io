<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yellow Turtle Games</title>
<style>
  :root { --ink: #4a2c5e; --muted: #7d6a8c; --bg: #fff4c2; --bg2: #ffcf5c; --card: #ffffff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: linear-gradient(var(--bg), var(--bg2)); color: var(--ink);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 16px; text-align: center; }
  h1 { font-size: 36px; margin: 0 0 4px; }
  .muted { color: var(--muted); margin: 0 0 32px; }
  .game { display: flex; gap: 20px; align-items: center; text-align: left; background: var(--card); border-radius: 24px;
    padding: 20px; box-shadow: 0 6px 24px rgba(74, 44, 94, 0.12); }
  .game img { width: 96px; height: 96px; border-radius: 22px; flex: none; }
  .game h2 { margin: 0 0 4px; font-size: 24px; }
  .game p { margin: 0 0 8px; }
  a { color: #b5641a; font-weight: 600; }
  footer { margin-top: 40px; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Yellow Turtle Games</h1>
  <p class="muted">Small, cosy games for short breaks.</p>
  <div class="game">
    <img src="meowtain-icon.png" alt="Meowtain icon">
    <div>
      <h2>Meowtain</h2>
      <p>Drop cute cats into the box. Matching cats merge into bigger ones. How big can your Meowtain grow?</p>
      <a href="privacy.html">Privacy policy</a>
    </div>
  </div>
  <footer>Contact: <a href="mailto:yellowturtle80@gmail.com">yellowturtle80@gmail.com</a></footer>
</main>
</body>
</html>
